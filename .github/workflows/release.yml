name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    uses: castrowithcee/qatlas-kit/.github/workflows/release.yml@22175dcfe29eb8966c9c6ea83d6af384a92d18a0 # v0.13.0
    permissions:
      contents: write
    with:
      program: qcrew
      namespace: qcrew-release
      signature-asset: checksums.txt.sig
      environment: release
    secrets:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
